<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificación por correo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 40px 16px; }
    form { background: #fff; padding: 24px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { font-size: 1.2rem; margin-top: 0; }
    label { display: block; margin-top: 14px; font-size: .9rem; font-weight: 600; }
    input { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    input.invalido { border-color: #dc2626; }
    .error { color: #dc2626; font-size: .8rem; min-height: 1em; }
    button { margin-top: 20px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: wait; }
    #resultado { margin-top: 14px; font-size: .9rem; text-align: center; }
    .ok { color: #16a34a; } .fallo { color: #dc2626; }
  </style>
</head>
<body>
  <form id="formulario" novalidate>
    <h1>Enviar notificación</h1>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" autocomplete="given-name">
    <div class="error" id="err-nombre"></div>

    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" autocomplete="family-name">
    <div class="error" id="err-apellido"></div>

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" autocomplete="email">
    <div class="error" id="err-correo"></div>

    <button type="submit" id="btn">Enviar</button>
    <div id="resultado"></div>
  </form>

  <script>
    // Expresión regular para validar el correo
    const REGEX_CORREO = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;

    const form = document.getElementById('formulario');
    const btn = document.getElementById('btn');
    const resultado = document.getElementById('resultado');

    function marcar(id, mensaje) {
      document.getElementById('err-' + id).textContent = mensaje;
      document.getElementById(id).classList.toggle('invalido', !!mensaje);
      return !mensaje;
    }

    function validar() {
      const nombre = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();
      const correo = document.getElementById('correo').value.trim();

      const a = marcar('nombre', nombre ? '' : 'Ingresa tu nombre.');
      const b = marcar('apellido', apellido ? '' : 'Ingresa tu apellido.');
      const c = marcar('correo', REGEX_CORREO.test(correo) ? '' : 'Ingresa un correo válido.');
      return a && b && c ? { nombre, apellido, correo } : null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultado.textContent = '';
      const datos = validar();
      if (!datos) return;

      btn.disabled = true;
      btn.textContent = 'Enviando...';
      try {
        const resp = await fetch('/api/notificar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        const json = await resp.json();
        resultado.className = resp.ok ? 'ok' : 'fallo';
        resultado.textContent = json.mensaje;
        if (resp.ok) form.reset();
      } catch (err) {
        resultado.className = 'fallo';
        resultado.textContent = 'No se pudo conectar con el servidor.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });
  </script>
</body>
</html>
